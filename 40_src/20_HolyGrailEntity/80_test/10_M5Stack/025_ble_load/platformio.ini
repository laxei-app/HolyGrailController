; BLE負荷テスト(025_ble_load)。Wi-Fi/BLE 共存の実測に使う道具。
;
; 【何をするか】撮影中のエッジ端末へ BLE で常時接続し、GATT read を連続で投げ続ける。
;  これで「BLE接続が張られてデータが流れている状態」を作り、撮影側(別のエッジ)の
;  撮影周期・測光がどれだけ乱れるかを比べる。
;
; 【なぜ専用機が要るか】PCに Bluetooth アダプタが無く、中央役になれない(2026-08-14 確認)。
;  スマホを使うにはアプリ側に実装が要る(実測してから実装する順序に反する)。そこで
;  予備の CoreS3 を中央役に仕立てる。製品コードには一切触らない。
;
; 使い方: pio run -t upload --upload-port COM6   (対象名は TARGET_NAME で指定)
[platformio]
src_dir = src
default_envs = debug

[env]
; 本体ファームと同じ platform/NimBLE を使う(共存の条件を揃えるため)。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv

lib_deps =
	m5stack/M5Unified@^0.2.5
	h2zero/NimBLE-Arduino@^2.2.3

build_flags =
	-std=gnu++17
	-D BOARD_HAS_PSRAM

build_unflags = -std=gnu++11

[env:debug]
build_type = debug

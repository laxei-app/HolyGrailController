; HolyGrail Controller エッジ端末(M5Stack CoreS3) ビルド設定。開発ステップ2.2 MVP。
; 実機が無いためビルド(コンパイル/リンク)確認まで。アップロードはしない。
;
;  アプリ(UI)  : 40_src/10_UI/10_M5Stack   (src_dir)
;  Entity共通  : 40_src/20_HolyGrailEntity/10_common
;  M5platform : 40_src/20_HolyGrailEntity/20_platform/10_M5Stack
;  天文/JSON  : 40_src/20_HolyGrailEntity/10_common/lib

[platformio]
src_dir = ../../10_UI/10_M5Stack
default_envs = debug

[env]
platform = espressif32 @ 6.5.0    ; ESP32-S3(CoreS3)対応
board = m5stack-cores3
framework = arduino

lib_deps =
	m5stack/M5Unified@^0.2.2
	WiFi

board_build.partitions = default_16MB.csv

; src_dir のアプリ一式 + 天文ライブラリ(astronomy.c)をビルド対象にする
build_src_filter =
	+<*>
	+<../../20_HolyGrailEntity/10_common/lib/astronomy/astronomy.c>

; Entity 共通部と M5Stack プラットフォーム層をライブラリとして取り込む
lib_extra_dirs =
	../../20_HolyGrailEntity/10_common
	../../20_HolyGrailEntity/20_platform/10_M5Stack

build_flags =
	-std=gnu++17
	-I ../../20_HolyGrailEntity/10_common/src
	-I ../../20_HolyGrailEntity/10_common/lib            ; json(json/nlohmann), astronomy(astronomy/)
	-I ../../20_HolyGrailEntity/20_platform/10_M5Stack/src
	-D ASTRONOMY_ENGINE_NO_CURRENT_TIME                  ; 端末時刻に依存しない(astronomy.c)

build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D _DEBUG
	-D _LOG_LVL=0

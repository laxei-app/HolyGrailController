; HolyGrail Controller エッジ端末(M5Stack CoreS3) ビルド設定。
;
;  アプリ(UI)  : 40_src/10_UI/10_M5Stack   (src_dir)
;  Entity共通  : 40_src/20_HolyGrailEntity/10_common
;  M5platform : 40_src/20_HolyGrailEntity/20_platform/10_M5Stack
;  天文/JSON  : 40_src/20_HolyGrailEntity/10_common/lib
;
; Arduino-ESP32 3.x(pioarduino)へ移行。3.x の Arduino は CONFIG_SPIRAM_USE_MALLOC=y のため
; malloc の大きな確保が PSRAM に載る。2カメラ同時撮影で測光/CCAPI パースの確保が内部DRAMを
; 食い潰し(minFree≒500B)、SSDP再探索の送信が errno 12(ENOMEM)で失敗→片方が撮影停止していた問題を
; 根治する(StickS3 と同じ路線)。CoreS3 は M5 公式ボードなので表示/電源は M5.begin が正しく行う。

[platformio]
src_dir = ../../10_UI/10_M5Stack
default_envs = debug

[env]
; Arduino-ESP32 3.x(pioarduino / ESP-IDF 5.x)。PSRAM を malloc に使わせ内部DRAMを空ける。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-cores3
framework = arduino

; 16MB Flash + PSRAM(CoreS3)。PSRAM は m5stack-cores3 ボード定義で有効化される。
board_build.partitions = default_16MB.csv

lib_deps =
	m5stack/M5Unified@^0.2.5
	h2zero/NimBLE-Arduino@^2.2.3
	; 3.x では組込みライブラリを明示しないとリンクされない(Wire/SPI/FS/… の実装が未リンクになる)。
	WiFi
	Network
	NetworkClientSecure
	HTTPClient
	Wire
	SPI
	FS
	LittleFS
	SD
	Preferences

; プラットフォーム層は shim(#include で共有)のため深いLDFにする。
lib_ldf_mode = deep+

; pre: 組込みライブラリ相互 include(WiFi→Network 等)を framework libraries/*/src の一括CPPPATHで解決。
; post: HolyGrailEntity 静的アーカイブを libHolyGrailEntity.a としてコピー出力する。
extra_scripts =
	pre:add_fw_includes.py
	post:copy_entity_lib.py

; src_dir のアプリ(UI)のみビルド対象。Entity は静的ライブラリ HolyGrailEntity が自前でビルドする。
;   エッジ成果物 = 10_common + 30_role/20_edge + 20_platform/10_M5Stack。
build_src_filter =
	+<*>
	+<../../20_HolyGrailEntity/30_role/20_edge/src/edgeKnownCameras.cpp>

lib_extra_dirs =
	../../20_HolyGrailEntity/10_common
	../../20_HolyGrailEntity/20_platform/10_M5Stack

build_flags =
	-std=gnu++17
	-D BOARD_HAS_PSRAM
	-D EDGE_NIMBLE2                ; NimBLE-Arduino 2.x のAPI差分を edgeProv.cpp で分岐(旧CoreS3=1.4)
	-I ../../20_HolyGrailEntity/10_common/src            ; entityヘッダ(holyGrailEntity.h等)
	-I ../../20_HolyGrailEntity/10_common/lib            ; UIが使う json(json/nlohmann)
	-I ../../20_HolyGrailEntity/20_platform/10_M5Stack/src
	-I ../../10_UI/18_M5Common                            ; エッジUIの共通部(バッテリ判定/アイコン)
	-I ../../10_UI/10_M5Stack                              ; 自機の batteryParams.h を拾う
	-I ../../20_HolyGrailEntity/30_role                  ; 役割別の窓口 roleDiscovery.h(30_role)
	-D ASTRONOMY_ENGINE_NO_CURRENT_TIME                  ; 端末時刻に依存しない(同梱 astronomy.c)

build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D _DEBUG
	-D _LOG_LVL=0

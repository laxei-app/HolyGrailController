; HolyGrail Controller エッジ端末(M5Stack CoreS3) ビルド設定。開発ステップ2.2 MVP。
; 実機が無いためビルド(コンパイル/リンク)確認まで。アップロードはしない。
;
;  アプリ(UI)  : 40_src/10_UI/10_M5Stack   (src_dir)
;  Entity共通  : 40_src/20_HolyGrailEntity/10_common
;  M5platform : 40_src/20_HolyGrailEntity/20_platform/10_M5Stack
;  天文/JSON  : 40_src/20_HolyGrailEntity/10_common/lib

[platformio]
src_dir = ../../10_UI/10_M5Stack
default_envs = debug

[env]
platform = espressif32 @ 6.5.0    ; ESP32-S3(CoreS3)対応
board = m5stack-cores3
framework = arduino

lib_deps =
	m5stack/M5Unified@^0.2.2
	WiFi

board_build.partitions = default_16MB.csv

; ビルド後に HolyGrailEntity の静的アーカイブを libHolyGrailEntity.a としてコピー出力する。
extra_scripts = post:copy_entity_lib.py

; src_dir のアプリ(UI)のみビルド対象。Entity(astronomy.c含む)は静的ライブラリ
; HolyGrailEntity(10_common/library.json)が自前でビルドする。
build_src_filter =
	+<*>

; Entity 共通部(静的ライブラリ HolyGrailEntity)と M5Stack プラットフォーム層を取り込む。
; Entity は UI 非依存の静的ライブラリ。UIライブラリの変更で Entity を編集する必要は無い。
lib_extra_dirs =
	../../20_HolyGrailEntity/10_common
	../../20_HolyGrailEntity/20_platform/10_M5Stack

build_flags =
	-std=gnu++17
	-I ../../20_HolyGrailEntity/10_common/src            ; entityヘッダ(holyGrailEntity.h等)
	-I ../../20_HolyGrailEntity/10_common/lib            ; UIが使う json(json/nlohmann)
	-I ../../20_HolyGrailEntity/20_platform/10_M5Stack/src
	-D ASTRONOMY_ENGINE_NO_CURRENT_TIME                  ; 端末時刻に依存しない(同梱 astronomy.c はPIOが入れ子ビルドするためグローバル指定)
	; ※ astronomy.c は HolyGrailEntity ライブラリ(10_common/lib/astronomy)としてビルドされる(app の src には含めない)

build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D _DEBUG
	-D _LOG_LVL=0

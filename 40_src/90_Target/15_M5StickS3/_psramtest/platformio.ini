; StickS3 の Octal PSRAM を「新コア(Arduino-ESP32 3.x / pioarduino)」で検証する最小テスト。
; アプリ本体(M5Unified/NimBLE/Entity)には一切依存せず、PSRAMが3.xで安定動作するかだけを見る。
; 結果はバックライト(GPIO38)の点滅で表示(ハングして真っ暗になっても判別できるように):
;   3回ゆっくり点滅→点灯 = PSRAM 読み書きOK / 速い点滅=PSRAM未検出 / 中速点滅=確保失敗 / 真っ暗=アクセスでハング
[env:psramtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Octal(OPI) PSRAM を有効化(このモジュールは N8R8 = 8MB Octal のはず)。
board_build.arduino.memory_type = qio_opi

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; ネイティブUSB。手動ダウンロードモードで書き込む。
upload_flags =
	--before=no_reset
	--after=hard_reset

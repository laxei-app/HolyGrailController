; HolyGrail Controller エッジ端末(M5StickC S3 / StickS3) ビルド設定。
; CoreS3(10_M5Stack)と同じ Entity/共通ロジックを使い、UI(表示・2ボタン)だけ 15_M5StickS3 に持つ。
;
;  アプリ(UI)  : 40_src/10_UI/15_M5StickS3           (src_dir)
;  ETP/BLE     : 40_src/10_UI/10_M5Stack             (etpEdge.cpp/edgeProv.cpp を共有=表示非依存)
;  Entity共通  : 40_src/20_HolyGrailEntity/10_common
;  M5platform : 40_src/20_HolyGrailEntity/20_platform/15_M5StickS3 (10_M5Stack を単一ソース再利用)
;
;  ハード: ESP32-S3-PICO / Flash 8MB(QIO) / PSRAM 8MB(Octal/OPI) / LCD ST7789P3 135x240 / KEY1=G11,KEY2=G12。
;  M5Unified はこのボードを自動認識しないため、UI 側で ST7789 パネルを明示初期化する。

[platformio]
src_dir = ../../10_UI/15_M5StickS3
default_envs = debug

[env]
; Arduino-ESP32 3.x(pioarduino)。2.0.x では Octal PSRAM(qio_opi)が起動時ハングしたが、
; 3.x では 8MB Octal PSRAM が正常動作することを実機確認済(_psramtest でSPIRAM 8MB検出+read/write OK)。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash 8MB(QIO) + PSRAM 8MB(Octal/OPI)を有効化。撮影計画/測光/CCAPIパースの大きな確保を
; PSRAMへ逃がしてRAM不足(bad_alloc)を根治する。3.xでは qio_opi が安定動作する。
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
	m5stack/M5Unified@^0.2.5
	h2zero/NimBLE-Arduino@^2.2.3
	; 3.x では組込みライブラリを明示しないとリンクされない(Wire/SPI/FS/… の実装が未リンクになる)。
	; 使用する組込みライブラリを列挙する(M5GFX=Wire/SPI、osFile=FS/LittleFS/SD、net=WiFi/Network/HTTPClient、creds=Preferences)。
	WiFi
	Network
	NetworkClientSecure
	HTTPClient
	Wire
	SPI
	FS
	LittleFS
	SD
	Preferences

; プラットフォーム層は shim(#include で 10_M5Stack を再利用)のため、相対include先の
; 依存(M5Unified 等)を検出できるよう深いLDFにする。
lib_ldf_mode = deep+

extra_scripts =
	pre:add_fw_includes.py
	post:copy_entity_lib.py

; ESP32-S3 ネイティブUSB。自動リセットが効かないため、手動でダウンロードモードに入れてから
; 書き込む(--before=no_reset)。書き込み後は自動でリセットして起動する(--after=hard_reset)。
upload_flags =
	--before=no_reset
	--after=hard_reset

; UI(15_M5StickS3)+ 共有 ETP/BLE(10_M5Stack の etpEdge/edgeProv)+ エッジ役の役割別コード。
build_src_filter =
	+<*>
	+<../10_M5Stack/etpEdge.cpp>
	+<../10_M5Stack/edgeProv.cpp>
	+<../../20_HolyGrailEntity/30_role/20_edge/src/edgeKnownCameras.cpp>

lib_extra_dirs =
	../../20_HolyGrailEntity/10_common
	../../20_HolyGrailEntity/20_platform/15_M5StickS3

build_flags =
	-std=gnu++17
	; 組込みライブラリ相互の include(WiFi→Network, LittleFS→FS 等)は add_fw_includes.py で
	; framework の libraries/*/src を一括 CPPPATH 追加して解決する(下 extra_scripts)。
	-D BOARD_HAS_PSRAM
	; 注: M5GFX_BOARD で StickS3 を強制認識させると M5 が StickS3 の電源管理(M5PM1 IRQ/I2C)まで
	; 掌握し、WiFi/BLE 稼働時に TG1 割り込みWDTでブートループした。そのため board 認識は既定(CoreS3
	; 誤検出=無害)のままとし、ちらつき解消に必要な「M5PM1 の LCD電源ON」だけを main.cpp で手動実行する。
	-D EDGE_NIMBLE2                ; NimBLE-Arduino 2.x のAPI差分を edgeProv.cpp で分岐(CoreS3=1.4)
	-D ARDUINO_USB_MODE=1          ; ネイティブUSB
	-D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial を USB-CDC に出す(検証ログ/シリアルコマンド用)
	-I ../../20_HolyGrailEntity/10_common/src
	-I ../../20_HolyGrailEntity/10_common/lib
	-I ../../20_HolyGrailEntity/20_platform/15_M5StickS3/src
	-I ../../10_UI/18_M5Common                            ; エッジUIの共通部(バッテリ判定/アイコン)
	; 自機の batteryParams.h を拾う。**下の 10_UI/10_M5Stack より必ず前に置くこと**
	; (CoreS3 側にも同名の batteryParams.h があり、順序が逆だとそちらを拾ってしまう)。
	-I ../../10_UI/15_M5StickS3
	-I ../../20_HolyGrailEntity/30_role
	-I ../../10_UI/10_M5Stack                             ; 共有する etpEdge.h/edgeProv.h
	-D ASTRONOMY_ENGINE_NO_CURRENT_TIME

build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D _DEBUG
	-D _LOG_LVL=0

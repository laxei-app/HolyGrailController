; HolyGrail Controller エッジ端末(M5Stack Core2) ビルド設定。
; CoreS3(10_M5Stack)と同じ Entity/共通UI を使う。Core2 は画面も 320x240 タッチで CoreS3 と同じなので、
; UI(main.cpp)も CoreS3 版を単一ソースとして再利用する(13_M5Core2/main.cpp は #include の shim)。
;
;  アプリ(UI)  : 40_src/10_UI/13_M5Core2                (src_dir。main/edgeRtc/battery* の shim と自機値)
;  共通UI      : 40_src/10_UI/18_M5Common
;  Entity共通  : 40_src/20_HolyGrailEntity/10_common
;  M5platform : 40_src/20_HolyGrailEntity/20_platform/13_M5Core2  (10_M5Stack を単一ソース再利用)
;
;  ハード: ESP32-D0WDQ6(無印。S3 ではない) / Flash 16MB / PSRAM 8MB(Quad) / LCD ILI9342C 320x240 /
;         タッチ FT6336U / PMIC AXP192 / RTC BM8563 / microSD。M5Unified が公式ボードとして自動認識する。
;
;  CoreS3 との違い(この ini で吸収するもの):
;   ・ネイティブUSBが無い(USBシリアルは CH9102)。自動リセットが効くので upload_flags は不要。
;   ・ARDUINO_USB_* の定義も不要(Serial はハードUART)。
;   ・PSRAM は Quad(ESP32)。board 定義で有効になるので memory_type の指定はしない。

[platformio]
; 【Core2 専用のパッケージ置き場】
; Core2 は custom_sdkconfig でフレームワークを自前ビルドする。pioarduino は
; framework-arduinoespressif32-libs を**全プロジェクト共有**で入れ替えるため、
; 共有のままだと CoreS3/StickS3 をビルドするたびに純正版へ戻され、
; Core2 をビルドするたびに IDF 全体の再ビルドが走る(往復ごとに長時間)。
; Core2 だけ別の core_dir へ逐して、他の2機のビルド環境に一切触らないようにする。
; ※ パスは**短く**すること。IDF のパッケージには 224 文字の内部パスを持つファイルがあり、
;   Windows の 260 文字制限に当たって展開に失敗する(実際に .platformio-core2 で失敗した)。
core_dir = C:/pio2
src_dir = ../../10_UI/13_M5Core2
default_envs = debug

[env]
; Arduino-ESP32 3.x(pioarduino)。CoreS3/StickS3 と揃える(malloc の大きな確保を PSRAM へ逃がす前提のため)。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-core2
framework = arduino

; 16MB Flash + PSRAM(Core2)。PSRAM は m5stack-core2 ボード定義で有効になる。
board_build.partitions = default_16MB.csv

lib_deps =
	m5stack/M5Unified@^0.2.5
	h2zero/NimBLE-Arduino@^2.2.3
	; 3.x では組込ライブラリを明示しないとリンクされない(Wire/SPI/FS/… の実装が未リンクになる)。
	WiFi
	Network
	NetworkClientSecure
	HTTPClient
	Wire
	SPI
	FS
	LittleFS
	SD
	Preferences

; プラットフォーム層と UI が shim(#include で共有)のため深いLDFにする。
lib_ldf_mode = deep+

; 【自前ビルドのときだけ必要】
; Arduino を ESP-IDF コンポーネントとしてビルドすると、esp_insights / esp_rainmaker が
; サーバ証明書をバイナリへ埋め込む前提で書かれている。PlatformIO にはここで明示する必要がある
; (無いと https_server.crt.S が見つからないというリンクエラーになる)。このプロジェクトは
; insights も rainmaker も使わないが、コンポーネント自体はビルド対象に入るため避けられない。
board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

extra_scripts =
	pre:../../10_UI/18_M5Common/bump_version.py
	pre:add_fw_includes.py
	post:copy_entity_lib.py

; UI(13_M5Core2: main.cpp + 機種固有の edgeRtc.cpp/batteryGuard.cpp)+ 共通UI(18_M5Common)+ エッジ役。
build_src_filter =
	+<*>
	+<../18_M5Common/etpEdge.cpp>
	+<../18_M5Common/edgeProv.cpp>
	+<../18_M5Common/etpBle.cpp>
	+<../../20_HolyGrailEntity/30_role/20_edge/src/edgeKnownCameras.cpp>

lib_extra_dirs =
	../../20_HolyGrailEntity/10_common
	../../20_HolyGrailEntity/20_platform/13_M5Core2

build_flags =
	-std=gnu++17
	-D BOARD_HAS_PSRAM
	-D HGC_EDGE_CORE2                                     ; 共有 main.cpp で Core2 だけの分岐が要るときに使う
	-I ../../20_HolyGrailEntity/10_common/src            ; entityヘッダ(holyGrailEntity.h等)
	-I ../../20_HolyGrailEntity/10_common/lib            ; UIが使う json(json/nlohmann)
	-I ../../20_HolyGrailEntity/20_platform/13_M5Core2/src
	-I ../../10_UI/18_M5Common                            ; エッジUIの共通部(バッテリ判定/アイコン)
	-I ../../10_UI/13_M5Core2                             ; 自機の batteryParams.h を拾う(CoreS3 より先に置く)
	-I ../../20_HolyGrailEntity/30_role                  ; 役割別の窓口 roleDiscovery.h(30_role)
	-D ASTRONOMY_ENGINE_NO_CURRENT_TIME                  ; 端末時刻に依存しない(同梱 astronomy.c)

build_unflags = -std=gnu++11

[env:release]
build_type = release

[env:debug]
build_type = debug
build_flags =
	${env.build_flags}
	-D _DEBUG
	-D _LOG_LVL=0

; 【フレームワークを自前ビルドする】
; 純正の Arduino フレームワークは BT を**デュアルモード(BR/EDR + BLE)**でビルドしており、
; コントローラだけで IRAM を 32,328 バイト使う。ESP32無印の IRAM は 128KB しか無いため
; これで 6,880 バイト溢れる。このプロジェクトは BLE しか使わないので、
; コントローラを BLE 専用にして BR/EDR の分を落とす。
; また BLE ホストは NimBLE-Arduino が自前で持つので、IDF 側の Bluedroid は不要。
custom_sdkconfig =
	CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
	CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=n
	CONFIG_BTDM_CTRL_MODE_BTDM=n
	CONFIG_BT_BLUEDROID_ENABLED=n
	CONFIG_BT_CONTROLLER_ONLY=y
	; フレームワークを自前ビルドすると sdkconfig の既定(4MB)が使われるので、Core2 の 16MB へ合わせる。
	; ※ choice 項目は「選ぶものを =y」だけ書く。=n で消すと選択が崩れて既定(4MB)に戻された。
	CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
	CONFIG_ESPTOOLPY_FLASHSIZE="16MB"
	; BLE Mesh は使わない。Bluedroid を外すと参照先を失ってビルドが崩れるので必ず一緒に切る。
	CONFIG_BLE_MESH=n

